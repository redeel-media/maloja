[project]
name = "malojaserver"
version = "3.2.4"
description = "Self-hosted music scrobble database"
readme = "README.md"
requires-python = "==3.12.*"
license = { file="LICENSE" }
authors = [ { name="Johannes Krattenmacher", email="maloja@dev.krateng.ch" } ]

urls.repository = "https://github.com/krateng/maloja"
urls.documentation = "https://github.com/krateng/maloja"
urls.homepage = "https://github.com/krateng/maloja"

keywords = ["scrobbling", "music", "selfhosted", "database", "charts", "statistics"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
	"Operating System :: OS Independent"
]

dependencies = [
	"bottle==0.13.*",
	"waitress==3.0.*",
	"doreah==2.0.*",
	"nimrodel==0.8.*",
	"setproctitle==1.3.*",
	"jinja2==3.1.*",
	"lru-dict==1.3.*",
	"psutil==5.9.*",
	"sqlalchemy==2.0",
	"python-datauri==3.0.*",
	"python-magic==0.4.*",
	"requests==2.32.*",
	"toml==0.10.*",
	"PyYAML==6.0.*",
	"pytest-benchmark>=5.2.1",
]

[project.optional-dependencies]
full = [
	"pyvips==2.2.*"
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=5.2.1",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]

[project.scripts]
maloja = "maloja.__main__:main"

[build-system]
requires = ["flit_core >=3.10,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "maloja"

[tool.osreqs.alpine]
build =[
	"gcc",
	"g++",
	"python3-dev",
	"libxml2-dev",
	"libxslt-dev",
	"libffi-dev",
	"libc-dev",
	"curl",
	"linux-headers"
]
run = [
	"python3",
	"py3-lxml",
	"tzdata",
	"libmagic"
]
opt = [
	"vips"
]

[tool.osreqs.debian]
build = [
	"curl"
]
run = [
	"python3"
]
opt = []
